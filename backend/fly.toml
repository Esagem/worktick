# Fly.io config — only NON-SECRET values live here.
# Secrets (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, API_SHARED_SECRET, HOURLY_RATE)
# are set via `fly secrets set`. See docs/SECURITY.md.
#
# Replace `app` with your own globally-unique name before first launch.

app = "worktick-CHANGEME"
primary_region = "atl"

[build]
  dockerfile = "Dockerfile"

[env]
  TIMEZONE = "America/Chicago"
  WORK_EVENT_TITLE = "McCrary Summer Work"
  POLL_INTERVAL_SECONDS = "21600"
  DB_PATH = "/data/worktick.db"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "worktick_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
